    // =========================================================================
    // 1. PYODIDE & SMART FALLBACK PYTHON RUNNER
    // =========================================================================
    let pyodideInstance = null;
    let pyodideReady = false;

    async function initPyodideEngine() {
      const badge = document.getElementById("pyRuntimeBadge");
      try {
        if (typeof loadPyodide === "function") {
          pyodideInstance = await loadPyodide();
          pyodideReady = true;
          badge.className = "hidden sm:inline-flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
          badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Python 3.11 Aktif`;
        } else {
          throw new Error("Pyodide script unavailable");
        }
      } catch (err) {
        pyodideReady = false;
        badge.className = "hidden sm:inline-flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-sky-500/20 text-sky-300 border border-sky-500/30";
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-sky-400"></span> Mode Simulator Python`;
      }
    }

    window.addEventListener("load", () => {
      setTimeout(initPyodideEngine, 300);
    });

    async function executePythonCode(code, customInputs = []) {
      if (pyodideReady && pyodideInstance) {
        try {
          const inputsJson = JSON.stringify(customInputs);
          const wrapper = `
import sys, io, builtins, json

_stdout = io.StringIO()
_stderr = io.StringIO()
sys.stdout = _stdout
sys.stderr = _stderr

_inputs = json.loads(${JSON.stringify(inputsJson)})
_input_idx = 0
def _custom_input(prompt=""):
    global _input_idx
    if prompt:
        print(prompt, end="")
    if _input_idx < len(_inputs):
        val = str(_inputs[_input_idx])
        _input_idx += 1
        print(val)
        return val
    return "0"

builtins.input = _custom_input

try:
${code.split("\n").map(line => "    " + line).join("\n")}
except Exception as e:
    import traceback
    traceback.print_exc()

_out = _stdout.getvalue()
_err = _stderr.getvalue()
(_out, _err)
`;
          const res = await pyodideInstance.runPythonAsync(wrapper);
          const out = res.get(0) || "";
          const err = res.get(1) || "";
          res.destroy();
          return { output: out, error: err };
        } catch (e) {
          return { output: "", error: String(e) };
        }
      } else {
        // Fallback lightweight simulator when offline / CDN blocked
        return simulatePythonFallback(code, customInputs);
      }
    }

    function simulatePythonFallback(code, customInputs) {
      try {
        const lines = code.split("\n");
        let outputs = [];
        let env = {};
        let inputIdx = 0;

        for (let raw of lines) {
          let line = raw.trim();
          if (!line || line.startsWith("#")) continue;
          if (line.includes("input(")) {
            const varName = line.split("=")[0].trim();
            const val = customInputs[inputIdx] !== undefined ? customInputs[inputIdx++] : "10";
            env[varName] = line.includes("int(") ? parseInt(val, 10) : line.includes("float(") ? parseFloat(val) : String(val);
            continue;
          }
          const assignMatch = line.match(/^([a-zA-Z_]\w*)\s*=\s*(.+)$/);
          if (assignMatch && !line.startsWith("print") && !line.startsWith("if") && !line.startsWith("for") && !line.startsWith("while") && !line.startsWith("def")) {
            const [, k, expr] = assignMatch;
            try {
              const jsExpr = expr.replace(/\bTrue\b/g, "true").replace(/\bFalse\b/g, "false").replace(/\/\//g, "/");
              const fn = new Function(...Object.keys(env), `return (${jsExpr});`);
              let val = fn(...Object.values(env));
              if (expr.includes("//") && typeof val === "number") val = Math.floor(val);
              env[k] = val;
            } catch (_) {
              env[k] = expr.replace(/^["']|["']$/g, "");
            }
          }
          const printMatch = line.match(/^print\((.+)\)$/);
          if (printMatch) {
            let inner = printMatch[1];
            try {
              const jsExpr = inner.replace(/\bTrue\b/g, "true").replace(/\bFalse\b/g, "false");
              const fn = new Function(...Object.keys(env), `return [${jsExpr}];`);
              const vals = fn(...Object.values(env));
              outputs.push(vals.join(" "));
            } catch (_) {
              outputs.push(inner.replace(/^["']|["']$/g, ""));
            }
          }
        }
        return {
          output: outputs.length ? outputs.join("\n") : "[Simulator Offline] Kode berhasil diparsing. Hubungkan internet untuk eksekusi Python penuh.",
          error: ""
        };
      } catch (err) {
        return { output: "", error: String(err) };
      }
    }

    function showToast(msg, isError = false) {

      const inner = document.getElementById("toastInner");
      const icon = document.getElementById("toastIcon");
      const text = document.getElementById("toastMessage");

      text.textContent = msg;
      icon.textContent = isError ? "⚠" : "✓";
      inner.className = isError
        ? "bg-rose-950 text-rose-100 text-sm font-semibold px-4 py-3 rounded-xl shadow-xl border border-rose-700 flex items-center gap-2.5"
        : "bg-slate-900 text-white text-sm font-semibold px-4 py-3 rounded-xl shadow-xl border border-slate-700 flex items-center gap-2.5";

      box.classList.remove("translate-y-20", "opacity-0");
      setTimeout(() => {
        box.classList.add("translate-y-20", "opacity-0");
      }, 2400);
    }

    function copySnippet(btnId, rawCode) {
      const temp = document.createElement("textarea");
      temp.value = rawCode;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand("copy");
      document.body.removeChild(temp);
      showToast("Kode Python disalin ke clipboard!");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

              Salin Kode
            </button>
          </div>
          <pre class="p-4 text-xs sm:text-sm overflow-x-auto leading-relaxed"><code>${highlightedHTML}</code></pre>
        </div>
      `;
    }

        visualWidgetHTML: `

            </div>
            <svg id="m1SvgDiagram" viewBox="0 0 720 175" class="w-full bg-white rounded-xl border border-slate-200 p-2">
              <!-- Step 1: input() -->

              <!-- Arrow 1 -->

        for j in range(0, n - i - 1):

    return arr

def insertion_sort(arr):
    for i in range(1, len(arr)):
        key = arr[i]
        j = i - 1
        while j >= 0 and key < arr[j]:
            arr[j + 1] = arr[j]
            j -= 1
        arr[j + 1] = key
    return arr

def merge_sort(arr):
    if len(arr) <= 1:
        return arr
    mid = len(arr) // 2
    kiri = merge_sort(arr[:mid])
    kanan = merge_sort(arr[mid:])
    hasil = []
    i = j = 0
    while i < len(kiri) and j < len(kanan):
        if kiri[i] < kanan[j]:
            hasil.append(kiri[i]); i += 1
        else:

        frames.push(`

            </div>
            <span class="font-mono text-xs font-extrabold px-2.5 py-1 rounded-lg ${i === 1 ? "bg-emerald-600 text-white" : "bg-rose-100 text-rose-800"}">
              return ${fact}

          </div>
        `);

    // Module 8 Sorting Visual
    let sortArr = [45, 18, 72, 29, 60, 12];
    let sortStepIdx = 0;
    function resetSortViz() {
      sortArr = [45, 18, 72, 29, 60, 12].sort(() => Math.random() - 0.5);
      sortStepIdx = 0;
      renderSortBars(sortArr, [], "Array acak siap diurutkan. Klik 'Langkah Berikutnya'.");
    }

    function renderSortBars(arr, activeIndices, statusText) {
      const box = document.getElementById("m8BarsContainer");
      const status = document.getElementById("m8SortStatus");
      if (!box) return;
      box.innerHTML = arr.map((val, idx) => {
        const isHighlight = activeIndices.includes(idx);
        return `
          <div class="flex flex-col items-center gap-1.5">
            <span class="font-mono text-xs font-extrabold text-slate-700">${val}</span>
            <div class="algo-bar w-9 sm:w-11 rounded-t-xl ${isHighlight ? "bg-amber-500" : "bg-blue-600"}" style="height: ${Math.max(24, val * 1.3)}px"></div>
          </div>
        `;
      }).join("");
      status.textContent = statusText;
    }

    function stepSortViz() {
      const algo = document.getElementById("m8AlgoSelect").value;
      const n = sortArr.length;
      if (algo === "bubble") {
        let swapped = false;
        for (let j = 0; j < n - 1; j++) {
          if (sortArr[j] > sortArr[j + 1]) {
            [sortArr[j], sortArr[j + 1]] = [sortArr[j + 1], sortArr[j]];
            renderSortBars(sortArr, [j, j + 1], `Bubble Sort: Menukar ${sortArr[j + 1]} dan ${sortArr[j]} karena posisi kiri > kanan.`);
            swapped = true;
            break;
          }
        }
        if (!swapped) renderSortBars(sortArr, [], "Selesai! Seluruh array sudah terurut sempurna.");
      } else if (algo === "insertion") {
        sortStepIdx = Math.min(sortStepIdx + 1, n - 1);
        let key = sortArr[sortStepIdx];
        let j = sortStepIdx - 1;
        while (j >= 0 && key < sortArr[j]) {
          sortArr[j + 1] = sortArr[j];
          j--;
        }
        sortArr[j + 1] = key;
        renderSortBars(sortArr, [j + 1], `Insertion Sort: Menyisipkan elemen ${key} ke posisi terurut di sebelah kiri.`);
      } else {
        sortArr.sort((a, b) => a - b);
        renderSortBars(sortArr, [0, 1, 2, 3, 4, 5], "Merge Sort: Membagi dua sub-array dan menggabungkannya kembali secara terurut O(n log n)!");
      }
    }

    // Module 9 Searching Visual
    function runSearchViz() {
      const box = document.getElementById("m9SearchBoxes");
      const stats = document.getElementById("m9SearchStats");
      const sel = document.getElementById("m9TargetSelect");
      if (!box || !sel) return;

      const arr = [5, 12, 19, 24, 31, 38, 45, 52, 67, 74, 88, 95];
      const target = Number(sel.value);

      // Linear trace
      let linearSteps = 0;
      for (let i = 0; i < arr.length; i++) {
        linearSteps++;
        if (arr[i] === target) break;
      }

      // Binary trace
      let low = 0, high = arr.length - 1, binaryVisited = [];
      while (low <= high) {
        const mid = Math.floor((low + high) / 2);
        binaryVisited.push(mid);
        if (arr[mid] === target) break;
        else if (arr[mid] < target) low = mid + 1;
        else high = mid - 1;
      }

      box.innerHTML = arr.map((val, idx) => {
        const isFound = val === target;
        const isBinChecked = binaryVisited.includes(idx);
        let cls = "bg-white border-slate-200 text-slate-700";
        if (isFound) cls = "bg-emerald-500 border-emerald-600 text-white font-extrabold ring-2 ring-emerald-300";
        else if (isBinChecked) cls = "bg-cyan-100 border-cyan-500 text-cyan-950 font-bold";
        return `
          <div class="p-2 rounded-xl border ${cls}">
            <div class="text-[9px] font-mono opacity-75">[${idx}]</div>
            <div class="font-mono text-xs sm:text-sm">${val}</div>
          </div>
        `;
      }).join("");

      stats.innerHTML = `
        <div class="bg-white border border-slate-200 rounded-xl p-3">
          <div class="font-bold text-slate-800">Linear Search</div>
          <div class="text-slate-600 mt-0.5">Memeriksa dari indeks 0 satu per satu: <strong class="text-rose-600">${linearSteps} langkah</strong></div>
        </div>
        <div class="bg-white border border-cyan-300 rounded-xl p-3">
          <div class="font-bold text-cyan-800">Binary Search</div>
          <div class="text-slate-600 mt-0.5">Melompat via titik tengah (kotak biru): <strong class="text-emerald-600">${binaryVisited.length} langkah</strong></div>
        </div>
      `;
    }

    // =========================================================================
    // 6. SANDBOX & QUIZ HANDLERS
    // =========================================================================
    function loadChallengeToSandbox(modId) {
      const m = MODULES.find(item => item.id === modId);
      document.getElementById("sandboxEditor").value = m.challenge.starter;
      document.getElementById("sandboxOutput").textContent = "Soal tantangan dimuat! Lengkapi kode lalu klik 'Periksa Jawaban Tantangan'.";
      showToast("Soal tantangan dimuat ke editor.");
    }

    function resetSandbox(modId) {
      const m = MODULES.find(item => item.id === modId);
      document.getElementById("sandboxEditor").value = m.sandboxDefault;
      document.getElementById("sandboxOutput").textContent = "Editor dikembalikan ke contoh awal.";
    }

    async function runSandbox(modId, isCheckChallenge) {
      const m = MODULES.find(item => item.id === modId);
      const code = document.getElementById("sandboxEditor").value;
      const outEl = document.getElementById("sandboxOutput");
      outEl.textContent = "Menjalankan kode Python...";

      const res = await executePythonCode(code, ["10", "5"]);
      if (res.error) {
        outEl.textContent = "❌ Error:\n" + res.error;
        return;
      }

      const cleanOut = res.output.trim();
      outEl.textContent = cleanOut || "(Program selesai tanpa output print)";

      if (isCheckChallenge) {
        const expected = m.challenge.expectedOutput.trim();
        if (cleanOut === expected || cleanOut.endsWith(expected)) {
          challengeCompleted[modId] = true;
          completedModules.add(modId);
          updateGlobalStats();
          renderSidebar();
          showToast("🎉 Luar biasa! Tantangan kode berhasil diselesaikan!");
          outEl.textContent += `\n\n✅ LULUS TANTANGAN! Output sesuai (${expected}).`;
        } else {
          showToast(`Output belum sesuai. Diharapkan: ${expected}`, true);
          outEl.textContent += `\n\n⚠️ Belum tepat. Output yang diharapkan: ${expected}`;
        }
      }
    }

    function answerQuiz(modId, qIdx, optIdx) {
      const key = `${modId}_${qIdx}`;
      quizAnswersState[key] = optIdx;
      const m = MODULES.find(item => item.id === modId);
      const allAnswered = m.quiz.every((_, idx) => quizAnswersState[`${modId}_${idx}`] !== undefined);
      if (allAnswered) {
        completedModules.add(modId);
      }
      updateGlobalStats();
      renderSidebar();
      renderActiveModule();
    }

    // Boot application
    renderSidebar();
    renderActiveModule();
    updateGlobalStats();
  </script>
</body>
</html>
